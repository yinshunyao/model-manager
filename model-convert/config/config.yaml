# 模型转换服务主配置文件

# MinIO存储配置
minio:
  # MinIO服务器地址
  endpoint: "8.137.18.24:9000"
  # 访问密钥
  access_key: "minio"
  # 密钥
  secret_key: "minio028"
  # 是否使用SSL
  secure: false
  # 桶名称
  bucket_name: "model-storage"
  # 模型存储路径前缀
  model_prefix: "models/"
  # 上传超时时间（秒）
  upload_timeout: 300

# MySQL数据库配置
mysql:
  # 数据库连接地址
  host: "127.0.0.1"
  # 数据库端口
  port: 3306
  # 数据库用户名
  user: "root"
  # 数据库密码
  password: "password"
  # 数据库名称
  dbname: "model_manager"
  # 连接池大小
  pool_size: 10
  # 连接超时时间（秒）
  connect_timeout: 10
  # 字符集
  charset: "utf8mb4"
  # 是否自动提交事务
  autocommit: true

# 服务器配置
server:
  # REST API服务器地址
  host: "0.0.0.0"
  # REST API服务器端口
  port: 38000
  # 是否启用调试模式
  debug: true
  # 最大请求体大小（MB）
  max_request_size: 100
  # 请求超时时间（秒）
  request_timeout: 300
  # 响应格式
  response_format: "json"

# 华为昇腾配置
ascend:
  # 目标芯片版本
  soc_version: "Ascend910B2"
  # 精度模式
  precision_mode: "allow_fp32_to_fp16"
  # ATC工具路径
  atc_path: "/usr/local/Ascend/ascend-toolkit/latest/atc/bin/atc"
  # 日志级别
  log_level: "error"

# 瑞芯微配置
rockchip:
  # 是否启用
  enabled: true
  # 工具路径
  tool_path: "/usr/local/rockchip/rknn-toolkit2"
  # 配置参数
  params:
    # 默认目标平台
    default_target_platform: "rk3588"
    # 支持的目标平台列表
    supported_platforms:
      - "rk3566"
      - "rk3568"
      - "rk3588"
      - "rk3562"
    # 默认精度模式
    default_precision: "float32"
    # 支持的精度模式列表
    supported_precisions:
      - "float32"
      - "float16"
      - "int8"
    # RKNN转换工具路径
    rknn_convert_path: "/usr/local/rockchip/rknn-toolkit2/bin/rknn_convert"

# 寒武纪配置
cambricon:
  # 是否启用
  enabled: true
  # 工具路径
  tool_path: "/usr/local/cambricon/magicmind/bin"
  # 配置参数
  params:
    # 默认精度模式
    default_precision: "force_float32"
    # 支持的精度模式列表
    supported_precisions:
      - "force_float32"
      - "force_float16"
    # MagicMind转换工具路径
    mmconvert_path: "/usr/local/cambricon/magicmind/bin/mmconvert"

# RabbitMQ配置
rabbitmq:
  # 连接配置
  connection:
    # RabbitMQ服务器地址
    host: "8.137.18.24"
    # RabbitMQ服务器端口
    port: 5672
    # RabbitMQ用户名
    username: "admin"
    # RabbitMQ密码
    password: "rmq-sd-sc"
    # 虚拟主机
    virtual_host: "/"
    # 连接超时时间（秒）
    connection_timeout: 10
    # 心跳间隔（秒）
    heartbeat: 60
    # 是否启用TLS
    use_ssl: false
  # 队列配置
  queues:
    # 任务队列名称
    task_queue: "model_convert_tasks"
    # 结果队列名称
    result_queue: "model_convert_results"

# 任务中心配置
task_center:
  # 任务中心URL
  url: "http://8.137.18.24:38000"

# 回调配置
callback:
  # 回调接口地址
   url: "http://45.126.120.18:3007/api/predict/callback"
#  url: "http://127.0.0.1:38000/api/predict/callback"